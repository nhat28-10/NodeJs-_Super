openapi: 3.0.4
info:
  title: Swagger Petstore - OpenAPI 3.0
  description: |-
    This is a sample Pet Store Server based on the OpenAPI 3.0 specification.  You can find out more about
    Swagger at [https://swagger.io](https://swagger.io). In the third iteration of the pet store, we've switched to the design first approach!
    You can now help us improve the API whether it's by making changes to the definition itself or to the code.
    That way, with time, we can improve the API in general, and expose some of the new features in OAS3.

    Some useful links:
    - [The Pet Store repository](https://github.com/swagger-api/swagger-petstore)
    - [The source API definition for the Pet Store](https://github.com/swagger-api/swagger-petstore/blob/master/src/main/resources/openapi.yaml)
  termsOfService: https://swagger.io/terms/
  contact:
    email: apiteam@swagger.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.12
externalDocs:
  description: Find out more about Swagger
  url: https://swagger.io
servers:
  - url: http://localhost:3000
tags:
  - name: users
    description: Các API liên quan đến Users
paths:
  /users/login:
    post:
      tags:
        - users
      summary: Đăng nhập
      description: Người dùng đăng nhập vào hệ thống
      operationId: login
      requestBody:
        description: Thông tin đăng nhập
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
        required: true
      responses:
        "200":
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login success
                  result:
                    $ref: "#/components/schemas/SuccessAuthentication"
        "422":
          description: Invalid input
  /users/me:
    get:
      tags:
        - users
      summary: Lấy thông tin user
      description: Người dùng lấy thông tin từ tài khoản của họ
      operationId: me
      security:
        - BearerAuth: []
      responses:
        default:
          description: Lấy thông tin user thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Get profile success
                  result:
                    $ref: "#/components/schemas/User"
components:
  schemas:
    LoginBody:
      type: object
      properties:
        email:
          type: string
          example: nhat1@gmail.com
        password:
          type: string
          example: Nhat12345@
    SuccessAuthentication:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoiNjlhNTI0NzIyMmYzNDAzMTc3MjY4NjBiIiwidG9rZW5fdHlwZSI6MCwidmVyaWZ5IjoxLCJpYXQiOjE3NzMyOTMxNDYsImV4cCI6MTc3MzM3OTU0Nn0.jV3N5jjI9lhJKw5C2vhPm4E788vU7e_Md0MqEsoHEL8
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoiNjlhNTI0NzIyMmYzNDAzMTc3MjY4NjBiIiwidG9rZW5fdHlwZSI6MSwidmVyaWZ5IjoxLCJpYXQiOjE3NzMyOTMxNDYsImV4cCI6MTc4MTkzMzE0Nn0.Un-nS5HpwyVVqkEJ3XNiOsLse_aPG6APPVtYzd7FvqE
    User:
      type: object
      properties:
        _id:
          type: string
          example: "69a5247222f340317726860b"
        name:
          type: string
          example: "Nhat"
        email:
          type: string
          format: email
          example: "nhat1@gmail.com"
        date_of_birth:
          type: string
          format: date-time
          example: "2025-12-31T04:43:58.335Z"
        created_at:
          type: string
          format: date-time
          example: "2026-03-02T05:47:30.869Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-03-02T05:48:15.002Z"
        verify:
          $ref: "#/components/schemas/UserVerifyStatus"
        twitter_circle:
          type: array
          items:
            type: string
            format: MongoId
          example:
            - ["698eb6b524d0327c37523221"]
        bio:
          type: string
          example: "Hi this is bio"
        location:
          type: string
          example: "81/43 Bach Van"
        website:
          type: string
          example: "website.com"
        username:
          type: string
          example: "nhat1"
        avatar:
          type: string
          example: http:image/images/avatars/johndoe.jpg"
        cover_photo:
          type: string
          example: "http:image/images/avatars/johndoe.jpg"
    UserVerifyStatus:
      type: number
      enum: [Unverified, Verified, Banned]
      example: 1
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
